name: Build and Deploy Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # To allow manual triggering

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: my-app
  APP_NAME: my-app
  APP_NAMESPACE: default
  EKS_CLUSTER_NAME: eks-cluster-1
  IMAGE_TAG: ${{ github.sha }}
  HELM_CHART_PATH: ./helm/my-app

jobs:

  test:
    name: Test App
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name app my-app

      - name: Test the web server
        run: |
          sleep 5
          curl -v http://localhost:8000/healthcheck

  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image to ECR
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Export Image URI
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Helm values with new image
        run: |
          # Update image tag in values.yaml
          sed -i "s|repository:.*|repository: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}|g" ${{ env.HELM_CHART_PATH }}/values.yaml
          sed -i "s|tag:.*|tag: ${{ github.sha }}|g" ${{ env.HELM_CHART_PATH }}/values.yaml

          cat ${{ env.HELM_CHART_PATH }}/values.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}  --kubeconfig ./kubeconfig
          echo 'KUBE_CONFIG_DATA<<EOF' >> $GITHUB_ENV
          echo $(cat ./kubeconfig | base64) >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm deploy
        uses: koslib/helm-eks-action@master
        env:
          # KUBECONFIG: ./kubeconfig # Alternative
          KUBE_CONFIG_DATA: ${{ env.KUBE_CONFIG_DATA }}
        with:
          # plugins: "https://github.com/jkroepke/helm-secrets" # optional
          command: helm upgrade --kubeconfig ./kubeconfig --install ${{ env.APP_NAME }} ${{ env.HELM_CHART_PATH }} --namespace ${{ env.APP_NAMESPACE }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} -n ${{ env.APP_NAMESPACE }} --kubeconfig ./kubeconfig
          kubectl get pods -n ${{ env.APP_NAMESPACE }} -l app=${{ env.APP_NAME }} --kubeconfig ./kubeconfig

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [test, build-and-deploy]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Notify via SNS (not configured, just as an example)
        run: |
          MESSAGE="ERROR: Pipeline failed in job: ${{ github.workflow }}. Commit: ${{ github.sha }}"
          aws sns publish --topic-arn $SNS_TOPIC_ARN --message "$MESSAGE"
