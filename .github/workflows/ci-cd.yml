  build-and-push:
    # needs: [test-docker, test-lambda]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase image name
      run: echo "LOWERCASE_IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "LOWERCASE_IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Update Helm values with new image
        run: |
          # Update image tag in values.yaml
          sed -i "s|repository:.*|repository: ${{ env.REGISTRY }}/${{ env.LOWERCASE_IMAGE_NAME }}|g" ${{ env.HELM_CHART_PATH }}/values.yaml
          sed -i "s|tag:.*|tag: ${{ github.sha }}|g" ${{ env.HELM_CHART_PATH }}/values.yaml
          cat ${{ env.HELM_CHART_PATH }}/values.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}  --kubeconfig ./kubeconfig
          echo 'KUBE_CONFIG_DATA<<EOF' >> $GITHUB_ENV
          echo $(cat ./kubeconfig | base64) >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm deploy
        uses: koslib/helm-eks-action@master
        env:
          # KUBECONFIG: ./kubeconfig # Alternative
          KUBE_CONFIG_DATA: ${{ env.KUBE_CONFIG_DATA }}
        with:
          # plugins: "https://github.com/jkroepke/helm-secrets" # optional
          command: helm upgrade --kubeconfig ./kubeconfig --install ${{ env.APP_NAME }} ${{ env.HELM_CHART_PATH }} --namespace ${{ env.APP_NAMESPACE }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} -n ${{ env.APP_NAMESPACE }} --kubeconfig ./kubeconfig
          kubectl get pods -n ${{ env.APP_NAMESPACE }} -l app=${{ env.APP_NAME }} --kubeconfig ./kubeconfig

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Notify via SNS (not configured, just as an example)
        run: |
          MESSAGE="ERROR: Pipeline failed in job: ${{ github.workflow }}. Commit: ${{ github.sha }}"
          aws sns publish --topic-arn $SNS_TOPIC_ARN --message "$MESSAGE"
